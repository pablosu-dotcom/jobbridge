openapi: 3.0.1
info:
  title: Api
  version: 0.1.0
servers:
- url: "http://host.docker.internal:9090/api"
paths:
  /jobs:
    get:
      operationId: getJobs
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
    post:
      operationId: postJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /admin/jobs/pending:
    get:
      operationId: getAdminJobsPending
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /admin/jobs/{id}/approve:
    put:
      operationId: putAdminJobsIdApprove
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /admin/jobs/{id}/reject:
    put:
      operationId: putAdminJobsIdReject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /organizations:
    post:
      operationId: postOrganizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /organizations/me:
    get:
      operationId: getOrganizationsMe
      parameters:
      - name: ownerUserId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "404":
          description: NotFound
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /admin/organizations/pending:
    get:
      operationId: getAdminOrganizationsPending
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /admin/organizations/{id}/approve:
    put:
      operationId: putAdminOrganizationsIdApprove
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /admin/organizations/{id}/reject:
    put:
      operationId: putAdminOrganizationsIdReject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
  /ai/match-jobs:
    post:
      operationId: postAiMatchJobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiMatchjobsPayload"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
        default:
          description: Any Response
          content:
            '*/*':
              schema:
                description: Any type of entity body
        "500":
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
        "400":
          description: BadRequest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorPayload"
components:
  schemas:
    AiMatchjobsPayload:
      required:
      - profile
      type: object
      properties:
        profile:
          type: string
      additionalProperties: false
    CreateJobRequest:
      required:
      - applyUrl
      - description
      - employmentType
      - location
      - organization
      - title
      type: object
      properties:
        title:
          type: string
        organization:
          type: string
        location:
          type: string
        employmentType:
          type: string
        description:
          type: string
        applyUrl:
          type: string
        salaryMin:
          type: number
          format: double
        salaryMax:
          type: number
          format: double
      additionalProperties: false
    ErrorPayload:
      required:
      - message
      - method
      - path
      - reason
      - status
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
          format: int64
        reason:
          type: string
        message:
          type: string
        path:
          type: string
        method:
          type: string
    Job:
      required:
      - applyUrl
      - description
      - employmentType
      - id
      - location
      - organization
      - status
      - title
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        organization:
          type: string
        location:
          type: string
        employmentType:
          type: string
        description:
          type: string
        applyUrl:
          type: string
        salaryMin:
          type: number
          format: double
        salaryMax:
          type: number
          format: double
        status:
          type: string
      additionalProperties: false
    Organization:
      required:
      - contactEmail
      - contactName
      - id
      - name
      - ownerUserId
      - status
      type: object
      properties:
        id:
          type: string
        ownerUserId:
          type: string
        name:
          type: string
        website:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        description:
          type: string
        status:
          type: string
      additionalProperties: false
    OrganizationRequest:
      required:
      - contactEmail
      - contactName
      - description
      - name
      - ownerUserId
      - website
      type: object
      properties:
        ownerUserId:
          type: string
        name:
          type: string
        website:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        description:
          type: string
      additionalProperties: false
